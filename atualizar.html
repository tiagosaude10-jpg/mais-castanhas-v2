<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Atualizando Mais Castanhas</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf6eb;color:#173b1e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(440px,100%);padding:28px;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(25,61,31,.14)}
    .spinner{width:48px;height:48px;margin:0 auto 18px;border:5px solid #e3ede2;border-top-color:#34713c;border-radius:50%;animation:girar .8s linear infinite}
    h1{font-size:1.35rem;margin:0 0 10px}p{color:#69736b;line-height:1.55;margin:0}
    @keyframes girar{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Atualizando o Mais Castanhas</h1>
    <p>Estamos removendo a versão antiga armazenada neste aparelho.</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      } catch (error) {
        console.error('Falha ao limpar a versão antiga:', error);
      }
      const separator = './?versao=4&hora=' + Date.now();
      window.location.replace(separator);
    })();
  </script>
</body>
</html>
